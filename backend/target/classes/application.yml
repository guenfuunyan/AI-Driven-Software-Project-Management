server:
  port: 8080

spring:
  application:
    name: ai-pm-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aipm}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
