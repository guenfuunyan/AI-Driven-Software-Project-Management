server:
  port: 8080

spring:
  application:
    name: ai-pm-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:aipm;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
